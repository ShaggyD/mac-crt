name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: ./scripts/build-app.sh release

      - name: Package
        run: |
          set -eu
          cd build
          # ditto, not zip: preserves the bundle's structure, permissions and
          # extended attributes so the .app survives a round trip.
          ditto -c -k --sequesterRsrc --keepParent "Mac CRT.app" MacCRT.zip
          shasum -a 256 MacCRT.zip > MacCRT.zip.sha256
          cat MacCRT.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MacCRT
          path: |
            build/MacCRT.zip
            build/MacCRT.zip.sha256
          if-no-files-found: error

  latest:
    name: Publish rolling latest build
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacCRT
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NOTES=$(printf 'Rolling build from `main` at `%s`.\n\nAssets are replaced on every push to `main`; the `latest` tag itself is a placeholder and does not move.' "$SHA")
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$NOTES"
            gh release upload latest dist/MacCRT.zip dist/MacCRT.zip.sha256 --clobber
          else
            gh release create latest dist/MacCRT.zip dist/MacCRT.zip.sha256 \
              --prerelease \
              --title "Latest build" \
              --notes "$NOTES"
          fi

  tagged:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacCRT
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" dist/MacCRT.zip dist/MacCRT.zip.sha256 \
            --title "Mac CRT ${GITHUB_REF_NAME}" \
            --generate-notes
